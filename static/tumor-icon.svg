<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#f5fbfc" stroke="#16a3a0" stroke-width="2"/>
  
  <!-- Gradient defs -->
  <defs>
    <linearGradient id="tumorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f06f5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f58973;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Tumor shape -->
  <path d="M 60 30 Q 75 35 78 50 Q 82 65 75 75 Q 60 85 45 75 Q 38 65 42 50 Q 45 35 60 30 Z" 
        fill="url(#tumorGrad)" opacity="0.9"/>
  
  <!-- Shine effect -->
  <ellipse cx="60" cy="45" rx="15" ry="12" fill="url(#shine)"/>
  
  <!-- Outer glow -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#f06f5a" stroke-width="1" opacity="0.2"/>
</svg>
